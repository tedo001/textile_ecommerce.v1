name: Retrain ML models

# Auto-retrain weekly + on demand. The job exports activity from the
# production database (via a separate export script you wire up to your env),
# runs the training pipeline, and pushes new model artifacts back to the repo
# under /models/. The ML service hot-reloads them on next request.

on:
  schedule:
    - cron: "0 3 * * 0" # every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you triggering a manual retrain?
        required: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        working-directory: ml
        run: pip install -r requirements.txt

      - name: Run training pipeline
        working-directory: ml
        env:
          MODELS_DIR: ${{ github.workspace }}/models
          DATA_DIR: ${{ github.workspace }}/data
        run: python -m training.train_all

      - name: Commit updated models
        run: |
          git config user.name "threadly-bot"
          git config user.email "bot@threadly.test"
          git add models/*.joblib || true
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "chore(ml): retrain models [skip ci]"
            git push
          fi
