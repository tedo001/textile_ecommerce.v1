version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: threadly-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: threadly-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ml
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/threadly
      - JWT_SECRET=change-me-in-production
      - ML_API_URL=http://ml:8000
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "5000:5000"

  ml:
    build:
      context: ./ml
    container_name: threadly-ml
    restart: unless-stopped
    environment:
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: threadly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
